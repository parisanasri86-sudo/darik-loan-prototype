<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9ebed"><meta name="robots" content="noindex,nofollow"><title>پروتوتایپ دریافت وام — داریک</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#e9ebed;color:#243238;font-family:Tahoma,Arial,sans-serif}#toolbar{height:56px;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;font-size:12px}#toolbar button,#toolbar select{font:inherit;padding:7px 11px;border:1px solid #c7ccd0;border-radius:7px;background:#fff;color:inherit;cursor:pointer}#toolbar button:disabled{opacity:.4;cursor:default}#toolbar select{max-width:150px}#stage{height:calc(100dvh - 56px);display:flex;align-items:center;justify-content:center;padding:0 8px 8px}#viewport{overflow:auto;scrollbar-width:none;direction:ltr;flex:none;box-shadow:0 5px 28px #17262e16;border-radius:24px;background:transparent;position:relative;touch-action:pan-y}#viewport::-webkit-scrollbar{display:none}#screen{position:relative;transform-origin:top left}#screen>.base{display:block;width:100%;height:auto;pointer-events:none;user-select:none}.hotspot{position:absolute;border:0;background:transparent;margin:0;padding:0;cursor:pointer;color:transparent;touch-action:pan-y}.hotspot:focus-visible{outline:2px solid #397794;outline-offset:-2px}.variant{position:absolute;pointer-events:none;overflow:hidden}.variant svg{display:block;width:100%;height:100%}.morph{position:absolute;left:0;top:0;width:100%;height:100%;z-index:100;pointer-events:none;overflow:hidden}.morph .clip{position:absolute;overflow:hidden;background:#fafafa}.morph .piece{position:absolute;max-width:none}.morph .fixed{position:absolute;left:0;top:0;width:375px;clip-path:inset(0 0 730px 0)}.hint .hotspot{background:#0089e518;outline:1px solid #0089e550}#error{position:fixed;inset:auto 12px 12px;padding:12px;background:#fff;color:#833;z-index:1000;border-radius:8px;display:none}
@media(max-width:450px){#toolbar{gap:6px;height:46px;font-size:11px}#toolbar .title{display:none}#toolbar button,#toolbar select{padding:7px 8px}#stage{height:calc(100dvh - 46px);padding:0 0 4px}#viewport{box-shadow:none}}
</style></head><body>
<header id="toolbar" aria-label="کنترل‌های نمایش پروتوتایپ"><span class="title">دریافت وام · داریک</span><button id="restart">شروع دوباره</button><button id="back" disabled>بازگشت</button><select id="screens" aria-label="انتخاب اسکرین"></select><button id="hint" aria-pressed="false" title="نمایش نقاط کلیک">نقاط کلیک</button></header>
<div id="stage"><div id="viewport"><main id="screen" aria-label="اسکرین پروتوتایپ"></main></div></div><div id="error" role="alert"></div>
<script src="assets.js"></script><script src="flow.js"></script><script src="prototype.js"></script></body></html>
