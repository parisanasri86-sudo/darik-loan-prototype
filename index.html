<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf3f7">
  <meta name="robots" content="noindex,nofollow">
  <title>خط اعتباری | نمونه تعاملی</title>
  <style>
    @font-face{font-family:IRANSansFaNum;src:url('fonts/iransans-fanum-regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:IRANSansFaNum;src:url('fonts/iransans-fanum-medium.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:IRANSansFaNum;src:url('fonts/iransans-fanum-bold.woff2') format('woff2');font-weight:700;font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#edf3f7;color:#142d42;font-family:Tahoma,Arial,sans-serif}
    #toolbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;background:#fff;border-bottom:1px solid #dce6ed;position:relative;z-index:2;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;min-width:150px}.brand img{width:64px;height:42px;object-fit:contain}.brand strong{display:block;font-size:15px}.brand small{display:block;color:#798a98;font-size:10px;margin-top:4px}
    .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls label{font-size:12px;color:#536a7c}.controls button,.controls select{height:40px;font:inherit;font-size:12px;padding:0 12px;border:1px solid #dce4e9;border-radius:10px;background:#fff;color:#213e53;cursor:pointer}.controls select{width:min(300px,36vw);text-overflow:ellipsis}.controls button:disabled{opacity:.4;cursor:default}.controls button:hover:not(:disabled){background:#f1f7fa}.controls button:focus-visible,.controls select:focus-visible{outline:2px solid #138a9a;outline-offset:2px}#restart{background:#123450;color:#fff;border-color:#123450}#restart:hover:not(:disabled){background:#1b4a6c}.zoom-controls{display:flex;align-items:center;gap:5px}.zoom-controls button{min-width:40px;font-size:18px}.zoom-controls #size{font-size:12px;min-width:92px}
    #stage{min-height:calc(100dvh - 72px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 0 28px}.screen-caption{text-align:center;margin:0 0 12px}.screen-caption strong{display:block;font-size:14px}.screen-caption small{display:block;color:#788b9a;margin-top:5px;font-size:11px}
    #device{position:relative;max-width:100vw}
    #viewport{overflow:hidden;direction:ltr;flex:none;border-radius:30px;background:transparent;position:relative}#screen{position:relative;transform-origin:top left}#screen>.base{display:block;width:100%;height:auto;pointer-events:none;user-select:none}.hotspot{position:absolute;border:0;background:transparent;margin:0;padding:0;cursor:pointer;color:transparent;touch-action:pan-y}.hotspot:focus-visible{outline:2px solid #397794;outline-offset:-2px}.variant{position:absolute;pointer-events:none;overflow:hidden}.variant svg{display:block;width:100%;height:100%}.morph{position:absolute;left:0;top:0;width:100%;height:100%;z-index:100;pointer-events:none;overflow:hidden}.morph .clip{position:absolute;overflow:hidden;background:#fafafa}.morph .piece{position:absolute;max-width:none}.morph .fixed{position:absolute;left:0;top:0;width:375px;clip-path:inset(0 0 730px 0)}.hint .hotspot{background:#0089e518;outline:1px solid #0089e550}#error{position:fixed;inset:auto 12px 12px;padding:12px;background:#fff;color:#833;z-index:1000;border-radius:8px;display:none}
    #screen .loan-plan,#screen .loan-text-patch,#screen .loan-name-patch,#screen .loan-wallet-card-patch{font-family:IRANSansFaNum,sans-serif}
    #screen .rial-inline{display:inline-block;flex:none;width:1.5em;height:1.5em;background:currentColor;mask:url('images/rial.svg') center/contain no-repeat;-webkit-mask:url('images/rial.svg') center/contain no-repeat}
    body.qa{background:#fff}body.qa #toolbar,body.qa .screen-caption{display:none}body.qa #stage{padding:0;min-height:0}body.qa #device{max-width:none}
    @media(max-width:700px){#toolbar{padding:8px 10px;gap:8px}.brand{min-width:auto}.brand img{width:48px;height:34px}.brand small{display:none}.controls{gap:5px}.controls label{display:none}.controls button,.controls select{height:35px;padding:0 8px;font-size:11px}.controls select{width:138px}.zoom-controls #size{min-width:70px}#stage{padding:14px 0 18px}}
  </style>
</head>
<body>
  <header id="toolbar" aria-label="کنترل‌های نمایش پروتوتایپ">
    <div class="brand"><img src="images/omidboom-logo.png" alt="لوگوی امیدبوم"><div><strong>خط اعتباری</strong><small>نمونه تعاملی</small></div></div>
    <div class="controls"><label for="screens">انتخاب صفحه</label><select id="screens" aria-label="انتخاب صفحه"></select><button id="back" disabled>بازگشت</button><button id="restart">شروع دوباره</button><button id="hint" aria-pressed="false" title="نمایش نقاط قابل کلیک">نقاط کلیک</button><div class="zoom-controls" aria-label="اندازه نمایش"><button id="smaller" aria-label="نمایش کوچک‌تر">−</button><button id="size" aria-label="بازگشت به اندازه اصلی">اندازه اصلی</button><button id="larger" aria-label="نمایش بزرگ‌تر">+</button></div></div>
  </header>
  <div id="stage"><div class="screen-caption"><strong id="screen-title">خط اعتباری</strong><small id="screen-counter"></small></div><div id="device"><div id="viewport" aria-label="صفحه پروتوتایپ"><main id="screen" aria-label="اسکرین پروتوتایپ"></main></div></div></div><div id="error" role="alert"></div>
  <script src="assets.js"></script><script src="flow.js"></script><script src="intro.js?v=20261014b"></script><script src="loan-plan.js?v=20261017-fees"></script><script src="screen-names.js?v=20261017"></script><script src="screen-overrides.js?v=20261017"></script><script src="prototype.js?v=20261015b"></script>
</body>
</html>
